apiVersion: v1
kind: deployement
metadata:
  name: mongodb
  Namespace: roboshop

  labels:
    project: roboshop
    tier: db
    component: mongodb

  spec:
     replicas: 1
     selector:
        matchlabels:
          project: roboshop
          tier: db
          component: mongodb

    #pod
     template:
       metadata:
         labels:
            project: roboshop
            tier: db
            component: mongodb
       spec:
         containers:
           - name: mongodb
             image: murali9686/mongodb:2.0.0

---
apiVersion: v1
kind: Service 
metadata:
   name: mongodb
   Namespace: roboshop

   labels:
     project: roboshop
     tier: db
     component: mongodb

   spec: 
  
     selector:
           project: roboshop
           tier: db
           component: mongodb

     ports:
       - protocol: TCP
         port: 27017
         targetport: 27017

        



